<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f2d1f2;
        }
        .game-container {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            gap: 20px;
        }
        .player-card {
            width: 48%;
            background-color: #e8e8f1;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .player-card.active {
            background-color: #081334;
            color: #f5c71f;
        }
        .player-card h3 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        .score-box {
            display: flex;
            justify-content: space-around;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        .score-box div {
            padding: 5px;
            font-weight: bold;
        }
        .btn-primary {
            width: 100px;
            height: 100px;
            font-size: 1.5em;
            border-radius: 10px;
            margin-top: 10px;
            background-color: #f5c71f;
            color: white;
            border: 2px solid #f5c71f;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .btn-primary:disabled {
            background-color: #d3d3d3;
            color: #7d7d7d;
            border: 2px solid #d3d3d3;
            cursor: not-allowed;
        }
        .btn-primary:hover {
            background-color: white;
            color: #081334;
            border: 2px solid #081334;
        }
        .btn-success {
            width: 100px;
            height: 100px;
            font-size: 1.5em;
            border-radius: 10px;
            margin-top: 10px;
            background-color: #f5c71f;
            color: white;
            border: 2px solid #f5c71f;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .btn-success:hover {
            background-color: white;
            color: #081334;
            border: 2px solid #081334;
        }
        .winner {
            font-size: 2em;
            color: #28a745;
            text-align: center;
            margin-top: 20px;
        }
        .turn-indicator {
            font-weight: bold;
            font-size: 1.3em;
            margin-top: 10px;
            color: royalblue;
        }
        .loading {
            font-size: 1.5em;
            color: royalblue;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        @media (max-width: 767px) {
            .game-container {
                flex-direction: column;
            }
            .player-card {
                width: 100%;
                margin-bottom: 20px;
            }
        }
        .blurred {
            filter: blur(5px);
            pointer-events: none;
        }
        .play-again-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 1.5em;
            background-color: #f5c71f;
            color: white;
            border: 2px solid #f5c71f;
            border-radius: 10px;
            cursor: pointer;
        }
        .play-again-btn:hover {
            background-color: white;
            color: #081334;
            border: 2px solid #081334;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center my-4">Dice Game: Reach 100 to Win!</h1>
    <div class="game-container" id="gameContainer">
        <div class="player-card" id="player1">
            <h3>Player 1</h3>
            <div class="score-box">
                <div>Current Score: <span id="player1Current">0</span></div>
                <div>Total Score: <span id="player1Total">0</span></div>
            </div>
            <button class="btn btn-primary" id="player1Roll" onclick="handleRoll(1)">Roll</button>
            <button class="btn btn-success mt-2" id="player1Save" onclick="handleSave(1)">Save</button>
            <div class="loading" id="loading1">Rolling...</div>
            <div class="turn-indicator" id="turnPlayer1">Your Turn</div>
        </div>

        <div class="player-card" id="player2">
            <h3>Player 2</h3>
            <div class="score-box">
                <div>Current Score: <span id="player2Current">0</span></div>
                <div>Total Score: <span id="player2Total">0</span></div>
            </div>
            <button class="btn btn-primary" id="player2Roll" onclick="handleRoll(2)">Roll</button>
            <button class="btn btn-success mt-2" id="player2Save" onclick="handleSave(2)">Save</button>
            <div class="loading" id="loading2">Rolling...</div>
            <div class="turn-indicator" id="turnPlayer2">Waiting for Player 1</div>
        </div>
    </div>

    <div class="winner" id="winnerMessage"></div>

    <button class="play-again-btn" id="playAgainBtn" onclick="playAgain()">Play Again</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentScore1 = 0, totalScore1 = 0;
    let currentScore2 = 0, totalScore2 = 0;
    let isPlayer1Turn = true;
    let gameOver = false;

    function updateTurn() {
        if (isPlayer1Turn) {
            document.getElementById('turnPlayer1').style.display = 'block';
            document.getElementById('turnPlayer2').style.display = 'none';
            document.getElementById('player1Roll').disabled = false;
            document.getElementById('player2Roll').disabled = true;
            document.getElementById('player1Save').disabled = false;
            document.getElementById('player2Save').disabled = true;
            document.getElementById('player1').classList.add('active');
            document.getElementById('player2').classList.remove('active');
        } else {
            document.getElementById('turnPlayer1').style.display = 'none';
            document.getElementById('turnPlayer2').style.display = 'block';
            document.getElementById('player1Roll').disabled = true;
            document.getElementById('player2Roll').disabled = false;
            document.getElementById('player1Save').disabled = true;
            document.getElementById('player2Save').disabled = false;
            document.getElementById('player2').classList.add('active');
            document.getElementById('player1').classList.remove('active');
        }
    }

    function rollDice() {
        return Math.ceil(Math.random() * 6);
    }

    function showLoading(playerId) {
        document.getElementById(`loading${playerId}`).style.display = 'block';
    }

    function hideLoading(playerId) {
        document.getElementById(`loading${playerId}`).style.display = 'none';
    }

    function handleRoll(player) {
        if (gameOver) return;

        let roll = rollDice();
        showLoading(player);

        setTimeout(() => {
            hideLoading(player);

            if (player === 1) {
                currentScore1 += roll;
                document.getElementById('player1Current').textContent = currentScore1;
            } else {
                currentScore2 += roll;
                document.getElementById('player2Current').textContent = currentScore2;
            }

            if (roll === 6) {
                if (player === 1) {
                    currentScore1 = 0;
                    document.getElementById('player1Current').textContent = 0;
                } else {
                    currentScore2 = 0;
                    document.getElementById('player2Current').textContent = 0;
                }
                nextTurn();
            }
        }, 1000);
    }

    function handleSave(player) {
        if (gameOver) return;

        if (player === 1) {
            totalScore1 += currentScore1;
            document.getElementById('player1Total').textContent = totalScore1;
            currentScore1 = 0;
            document.getElementById('player1Current').textContent = 0;
        } else {
            totalScore2 += currentScore2;
            document.getElementById('player2Total').textContent = totalScore2;
            currentScore2 = 0;
            document.getElementById('player2Current').textContent = 0;
        }

        if (totalScore1 >= 100) {
            gameOver = true;
            document.getElementById('winnerMessage').textContent = 'Player 1 Wins! Congratulations!';
            document.getElementById('gameContainer').classList.add('blurred');
            document.getElementById('playAgainBtn').style.display = 'block';
        } else if (totalScore2 >= 100) {
            gameOver = true;
            document.getElementById('winnerMessage').textContent = 'Player 2 Wins! Congratulations!';
            document.getElementById('gameContainer').classList.add('blurred');
            document.getElementById('playAgainBtn').style.display = 'block';
        } else {
            nextTurn();
        }
    }

    function nextTurn() {
        isPlayer1Turn = !isPlayer1Turn;
        updateTurn();
    }

    function playAgain() {
        currentScore1 = 0;
        totalScore1 = 0;
        currentScore2 = 0;
        totalScore2 = 0;
        gameOver = false;
        isPlayer1Turn = true;

        document.getElementById('player1Current').textContent = 0;
        document.getElementById('player1Total').textContent = 0;
        document.getElementById('player2Current').textContent = 0;
        document.getElementById('player2Total').textContent = 0;
        document.getElementById('winnerMessage').textContent = '';
        document.getElementById('playAgainBtn').style.display = 'none';
        document.getElementById('gameContainer').classList.remove('blurred');

        updateTurn();
    }

    updateTurn();
</script>

</body>
</html>
